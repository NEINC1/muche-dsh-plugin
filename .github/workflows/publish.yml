name: publish

# Tag-driven npm release for muche-dsh-plugin.
# Setup once on npm: package settings -> Trusted publishing -> add
#   Publisher: GitHub Actions
#   Repository: NEINC1/muche-dsh-plugin
#   Workflow filename: publish.yml
# Then every pushed tag like v0.8.13 publishes with provenance (no long-lived token).
# Republishing an already-published version is a successful no-op.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm trusted publishing support
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (![major, minor, patch].every(Number.isInteger) || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$NPM_VERSION"
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package version $VERSION"
            exit 1
          fi
      - name: Check whether this version is already published
        id: exists
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "muche-dsh-plugin@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
